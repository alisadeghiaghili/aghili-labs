<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Data Modeling and Warehousing">
  <rect width="64" height="64" rx="14" fill="#09162A"/>
  <g transform="translate(12 12)">
    <!-- Star Schema Dimension Links -->
    <line x1="20" y1="20" x2="20" y2="6" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="2 2"/>
    <line x1="20" y1="20" x2="20" y2="34" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="2 2"/>
    <line x1="20" y1="20" x2="6" y2="20" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="2 2"/>
    <line x1="20" y1="20" x2="34" y2="20" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="2 2"/>
    <!-- Top Dim Table -->
    <rect x="14" y="2" width="12" height="7" rx="2" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="16" y1="5.5" x2="24" y2="5.5" stroke="#93C5FD" stroke-width="1"/>
    <!-- Bottom Dim Table -->
    <rect x="14" y="31" width="12" height="7" rx="2" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="16" y1="34.5" x2="24" y2="34.5" stroke="#93C5FD" stroke-width="1"/>
    <!-- Left Dim Table -->
    <rect x="0" y="16.5" width="12" height="7" rx="2" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="2" y1="20" x2="10" y2="20" stroke="#93C5FD" stroke-width="1"/>
    <!-- Right Dim Table -->
    <rect x="28" y="16.5" width="12" height="7" rx="2" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.5"/>
    <line x1="30" y1="20" x2="38" y2="20" stroke="#93C5FD" stroke-width="1"/>
    <!-- Central Fact Table -->
    <rect x="13" y="13" width="14" height="14" rx="3" fill="#B45309" stroke="#FBBF24" stroke-width="2"/>
    <line x1="16" y1="17" x2="24" y2="17" stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="21" x2="22" y2="21" stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="24" x2="20" y2="24" stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
