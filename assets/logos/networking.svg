<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Networking">
  <rect width="64" height="64" rx="14" fill="#0A1526"/>
  <g transform="translate(13 13)">
    <!-- Network Mesh Connection Lines -->
    <line x1="19" y1="19" x2="6" y2="7" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="19" y1="19" x2="32" y2="7" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="19" y1="19" x2="6" y2="31" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="19" y1="19" x2="32" y2="31" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Active Pulse Signals -->
    <line x1="19" y1="19" x2="10" y2="10.5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="19" y1="19" x2="27" y2="26.5" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Outer Network Nodes -->
    <circle cx="6" cy="7" r="4.5" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="32" cy="7" r="4.5" fill="#1E293B" stroke="#818CF8" stroke-width="2"/>
    <circle cx="6" cy="31" r="4.5" fill="#1E293B" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="32" cy="31" r="4.5" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
    <!-- Inner Packet Pulses -->
    <circle cx="6" cy="7" r="2" fill="#38BDF8"/>
    <circle cx="32" cy="7" r="2" fill="#818CF8"/>
    <circle cx="6" cy="31" r="2" fill="#FBBF24"/>
    <circle cx="32" cy="31" r="2" fill="#34D399"/>
    <!-- Center Router / Intelligent Switch Hub -->
    <circle cx="19" cy="19" r="7.5" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="19" cy="19" r="3" fill="#FFFFFF"/>
  </g>
</svg>
