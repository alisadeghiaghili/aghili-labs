    <rect x="18" y="28" width="5.5" height="5" rx="1" fill="#A855F7"/>
    <rect x="25.5" y="28" width="5.5" height="5" rx="1" fill="#EC4899"/>
    <rect x="33" y="28" width="5.5" height="5" rx="1" fill="#34D399"/>
